[project]
name = "face-scout"
version = "0.1.0"
description = "Real-time webcam face tracking with dense mesh landmarks and identity recognition; foundation for later lip reading"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "typer>=0.12",
    # Phase 2 lip-reading v1 classifier (landmark features -> label); see ADR 0001.
    "scikit-learn>=1.5",
]

[project.scripts]
face-scout = "face_scout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
